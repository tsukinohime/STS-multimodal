# =============================================================================
# 32-pair smoke test for condition E2, laptop-sized.
#
#   python scripts/smoke_test.py --config configs/e2_smoke.yaml --e2
#   python -m sts.cli compare --config configs/e2_smoke.yaml    # needs the D2 and text-judge smoke outputs
#
# Exercises every E2 code path (donor assignment, VLM judging on the sentence
# pair plus another pair's images, caches, resume, reports, the comparison)
# with the stand-ins of configs/d2_smoke.yaml:
#
#   generator  render-text: typesets each sentence onto a white canvas. The
#              images block equals d1_smoke.yaml's, so the smoke tests share
#              one store.
#   judge      Qwen3.5-0.8B, as in d2_smoke.yaml. Scores mean nothing.
#
# The comparison runs are the D2 smoke (same stand-in judge) and the
# text-judge smoke (a different stand-in, Qwen2.5-0.5B): all three subsample
# with the same limit and seed, so they scored the same pairs.
# =============================================================================

experiment:
  name: e2_smoke
  condition: E2
  output_dir: outputs/e2_smoke
  seed: 42
  limit: 32
  resume: false

data:
  root: data/raw
  sick_path: data/raw/sick/SICK.txt
  cxc_dir: data/raw/cxc/data
  coco_karpathy_json: data/raw/coco_karpathy/dataset_coco.json
  sts3k_path: data/raw/sts3k/STS3k_all.txt

datasets:
  - cxc-val
  - cxc-test
  - sick-test
  - sick-all
  - sts3k

runtime:
  device: auto
  dtype: auto
  batch_size: 4
  max_length: 512
  cache_dir: .cache/e2_smoke
  use_cache: true
  flush_every: 16
  progress: true
  seed: 42

images:
  store_dir: .cache/images_smoke
  flush_every: 64
  preview_pairs: 2
  generator:
    key: render-text-512
    model_id: none
    backend: render-text
    height: 512
    width: 512
    seed: 0
    seed_policy: shared
    batch_size: 16
    image_format: png

models: []

judges:
  - key: e2-qwen3.5-0.8b-stub
    model_id: Qwen/Qwen3.5-0.8B
    backend: hf
    prompt_set: text-image-v1
    input: text+image
    images_from: other-pair
    mismatch_seed: 0
    image_size: 256
    enable_thinking: false
    symmetry_check_sample: 16
    min_valid_mass: 0.05
    batch_size: 4
    max_prompt_tokens: 4096
    enabled: true
    notes: "Pipeline-exercise judge only; its scores are not meaningful."

comparison:
  matched:  {output_dir: outputs/d2_smoke, model: d2-qwen3.5-0.8b-stub}
  no_image: {output_dir: outputs/llm_judge_smoke, model: qwen2.5-0.5b-stub}
  bootstrap: 200

metrics:
  bootstrap: 200
  bootstrap_seed: 12345
  confidence: 0.95
  report_domains: true
  macro_average_over:
    - cxc-val
    - cxc-test
    - sick-test
    - sts3k
